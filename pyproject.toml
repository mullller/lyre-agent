[project]
name = "lyre-agent"
version = "0.1.0"
description = "Local-first CLI agent for developer workflows"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[project.scripts]
lyre-agent = "lyre_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
